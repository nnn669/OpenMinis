name: Android Release Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android NDK r28
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          # r28c stable — the 28.0.12433566 build number previously here
          # doesn't correspond to any published NDK release (404 from the
          # download host), which skipped every subsequent step.
          ndk-version: "28.2.13676358"
          add-to-path: false

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src/android/**/*.gradle*', 'src/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Builds the proot binary from source (deps/proot + deps/talloc) and
      # installs it into both assets/proot-aarch64 and
      # jniLibs/arm64-v8a/libproot.so.
      - name: Build proot
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x deps/build_proot.sh
          ./deps/build_proot.sh

      # Downloads the Alpine minirootfs (proot-aarch64 already present from
      # the previous step, so this script only fetches the rootfs archive).
      - name: Prepare Android sandbox rootfs
        run: |
          chmod +x scripts/prepare_android_sandbox.sh
          ./scripts/prepare_android_sandbox.sh

      - name: Verify sandbox assets are uncompressed-eligible
        run: |
          ls -lh src/android/app/src/main/assets/proot-aarch64
          ls -lh src/android/app/src/main/assets/alpine-minirootfs.tar*

      - name: Build release APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify rootfs asset is stored uncompressed in the APK
        run: |
          APK=$(find src/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK"
          unzip -v "$APK" | grep -E "alpine-minirootfs|proot-aarch64"
          if unzip -v "$APK" | grep -E "alpine-minirootfs" | grep -qv "Stored"; then
            echo "::error::alpine-minirootfs asset is compressed in the APK — RootfsManager.openFd() will fail at runtime."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openminis-release-apk
          path: src/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
